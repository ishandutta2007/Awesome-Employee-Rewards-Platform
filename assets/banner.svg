<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 350"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes float1{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(2deg)}}@keyframes float2{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(10px) rotate(-2deg)}}@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.08)}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:46px;fill:url(#textGrad)}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#e2e8f0}.floating-card-1{animation:float1 6s ease-in-out infinite;transform-origin:center}.floating-card-2,.pulsing-orb{animation:float2 7s ease-in-out infinite;transform-origin:center}.pulsing-orb{animation:pulseGlow 5s ease-in-out infinite}</style><rect width="1200" height="350" fill="url(#bgGrad)" rx="16"/><circle cx="200" cy="90" r="140" fill="#6366f1" class="pulsing-orb" filter="url(#glow)" opacity=".4"/><circle cx="1000" cy="260" r="160" fill="#ec4899" class="pulsing-orb" filter="url(#glow)" opacity=".3"/><g class="floating-card-1" opacity=".6"><rect width="280" height="90" x="820" y="50" fill="url(#cardGrad)" stroke="#fff" stroke-opacity=".15" stroke-width="1" rx="12"/><circle cx="860" cy="95" r="20" fill="#10b981" opacity=".8"/><text x="860" y="101" fill="#fff" font-family="sans-serif" font-size="18" text-anchor="middle">🏆</text><rect width="140" height="10" x="895" y="80" fill="#38bdf8" opacity=".7" rx="5"/><rect width="90" height="8" x="895" y="98" fill="#94a3b8" opacity=".5" rx="4"/></g><g class="floating-card-2" opacity=".6"><rect width="260" height="85" x="100" y="210" fill="url(#cardGrad)" stroke="#fff" stroke-opacity=".15" stroke-width="1" rx="12"/><circle cx="140" cy="252" r="18" fill="#f59e0b" opacity=".8"/><text x="140" y="258" fill="#fff" font-family="sans-serif" font-size="16" text-anchor="middle">⭐</text><rect width="120" height="10" x="172" y="240" fill="#c084fc" opacity=".7" rx="5"/><rect width="70" height="8" x="172" y="258" fill="#94a3b8" opacity=".5" rx="4"/></g><g text-anchor="middle"><text x="600" y="80" filter="url(#glow)" font-family="sans-serif" font-size="38">🎁 👏 🌟</text><text x="600" y="145" class="title" filter="url(#glow)">Awesome Employee Rewards Platform</text><text x="600" y="190" class="subtitle">A Curated Ecosystem of SaaS Products &amp; Open-Source Recognition Tools</text><g transform="translate(340, 230)"><rect width="160" height="36" x="0" y="0" fill="#fff" fill-opacity=".08" stroke="#818cf8" stroke-width="1.5" rx="18"/><text x="80" y="23" class="badge-text" text-anchor="middle">🤝 Peer Recognition</text><rect width="160" height="36" x="180" y="0" fill="#fff" fill-opacity=".08" stroke="#38bdf8" stroke-width="1.5" rx="18"/><text x="260" y="23" class="badge-text" text-anchor="middle">💎 Points &amp; Perks</text><rect width="160" height="36" x="360" y="0" fill="#fff" fill-opacity=".08" stroke="#c084fc" stroke-width="1.5" rx="18"/><text x="440" y="23" class="badge-text" text-anchor="middle">🚀 Open Source HR</text></g></g></svg>